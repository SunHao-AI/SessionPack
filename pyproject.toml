[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionpack"
dynamic = ["version"]
description = "Trae 会话归档与同步：本地只读会话管理"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

# 版本单一来源：升版只改 sessionpack/__init__.py 的 __version__
# （setuptools 走 AST 静态读字面量，不 import 包；tests/test_version_guard.py 锁死此约定）
[tool.setuptools.dynamic]
version = {attr = "sessionpack.__version__"}

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
sessionpack = "sessionpack.cli:main"

[tool.setuptools.packages.find]
include = ["sessionpack*"]

[tool.setuptools.package-data]
sessionpack = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
files = ["sessionpack"]
ignore_missing_imports = true
